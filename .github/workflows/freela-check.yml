name: Freela Mercado Pago integration checks
on:
  pull_request:
    paths:
      - "api/freela.js"
      - "lib/freela-license.js"
      - "lib/freela-openai-ads.js"
      - "assets/freela/freela-na-vida-real.js"
      - "freela-na-vida-real/**"
      - "tests/freela-mercadopago.test.mjs"
      - ".github/workflows/freela-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax validation
        run: npm run check:freela
      - name: Mercado Pago flow and security tests
        run: node --test tests/freela-mercadopago.test.mjs
