name: Freela Mercado Pago integration checks
on:
  pull_request:
    paths:
      - "api/freela.js"
      - "lib/freela-license.js"
      - "lib/freela-openai-ads.js"
      - "lib/freela-payment-policy.js"
      - "lib/freela-readiness.js"
      - "lib/freela-delivery-probe.js"
      - "assets/freela/checkout-aprovacao.js"
      - "assets/freela/order-access.js"
      - "assets/freela/mercadopago-return.js"
      - "assets/freela/freela-na-vida-real.js"
      - "freela-na-vida-real/**"
      - "es/freelance-en-la-vida-real/**"
      - "assets/freela/es/**"
      - "assets/freela/freela-sales.css"
      - "tests/freela-*.test.mjs"
      - ".github/workflows/freela-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax validation
        run: npm run check:freela
      - name: Mercado Pago flow and security tests
        run: node --check assets/freela/es/freelance-es.js && node --check assets/freela/checkout-aprovacao.js && node --check assets/freela/mercadopago-return.js && node --check assets/freela/order-access.js && node --test tests/freela-*.test.mjs
